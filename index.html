<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Echo Mix Videoke - Song Updates</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    font-family: Arial, Helvetica, sans-serif;
    background: #080808;
    color: #fff;
}

body {
    padding: 30px 18px 50px;
}

.container {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
}

.header {
    text-align: center;
    margin-bottom: 30px;
}

.header h1 {
    margin: 0;
    font-size: 36px;
    font-weight: 800;
    letter-spacing: 1px;
}

.header p {
    margin: 10px 0 0;
    color: #aaa;
    font-size: 16px;
}

.status {
    background: #151515;
    border: 1px solid #292929;
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 20px;
    text-align: center;
    color: #bbb;
}

.status strong {
    color: #fff;
}

.updates {
    display: grid;
    grid-template-columns: repeat(
        auto-fit,
        minmax(260px, 1fr)
    );
    gap: 12px;
}

.update {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: #151515;
    border: 1px solid #292929;
    border-radius: 12px;
    padding: 14px 16px;
}

.update-name {
    min-width: 0;
}

.update-name strong {
    display: block;
    font-size: 16px;
    word-break: break-all;
}

.update-name span {
    display: block;
    margin-top: 4px;
    font-size: 12px;
    color: #888;
}

.download {
    flex-shrink: 0;
    display: inline-block;
    padding: 9px 14px;
    border-radius: 8px;
    background: #19c463;
    color: #000;
    text-decoration: none;
    font-weight: 700;
    font-size: 13px;
}

.download:hover {
    filter: brightness(1.12);
}

.footer {
    margin-top: 30px;
    text-align: center;
    color: #666;
    font-size: 12px;
}

.loading {
    text-align: center;
    color: #aaa;
    padding: 30px;
}

.empty {
    text-align: center;
    color: #888;
    padding: 30px;
    background: #151515;
    border: 1px solid #292929;
    border-radius: 12px;
}

.error {
    text-align: center;
    color: #ff6b6b;
    padding: 30px;
    background: #151515;
    border: 1px solid #3a2020;
    border-radius: 12px;
}

@media (max-width: 600px) {

    body {
        padding: 20px 12px 40px;
    }

    .header h1 {
        font-size: 28px;
    }

    .update {
        padding: 12px;
    }

    .download {
        padding: 8px 11px;
    }

}

</style>

</head>

<body>

<div class="container">

    <div class="header">

        <h1>🎤 Echo Mix Videoke</h1>

        <p>
            Song Update Center
        </p>

    </div>


    <div class="status" id="status">

        Checking available updates...

    </div>


    <div class="updates" id="updates">

        <div class="loading">
            Please wait...
        </div>

    </div>


    <div class="footer">

        Echo Mix Videoke Song Update Server

    </div>

</div>


<script>

"use strict";


/* =========================================================
   SETTINGS
========================================================= */

const BASE_URL = "./";

const MANIFEST_FILE = "updates.json";


/* =========================================================
   ELEMENTS
========================================================= */

const updatesContainer =
    document.getElementById("updates");

const statusElement =
    document.getElementById("status");


/* =========================================================
   CREATE SONG ELEMENT
========================================================= */

function createSongElement(fileName) {

    const item =
        document.createElement("div");

    item.className =
        "update";


    const name =
        document.createElement("div");

    name.className =
        "update-name";


    const title =
        document.createElement("strong");

    title.textContent =
        fileName;


    const description =
        document.createElement("span");

    description.textContent =
        "Song package available";


    name.appendChild(title);

    name.appendChild(description);


    const button =
        document.createElement("a");

    button.className =
        "download";

    button.textContent =
        "DOWNLOAD";


    button.href =
        BASE_URL + fileName;


    button.download =
        fileName;


    item.appendChild(name);

    item.appendChild(button);


    return item;

}


/* =========================================================
   VALIDATE SONG NAME
========================================================= */

function isValidSongFile(fileName) {

    if (
        typeof fileName !== "string"
    ) {

        return false;

    }


    /*
        Only:

        1.mp4
        2.mp4
        1234.mp4
        ...
        99999.mp4
    */

    return /^[1-9][0-9]{0,4}\.mp4$/i
        .test(fileName);

}


/* =========================================================
   LOAD MANIFEST
========================================================= */

async function loadManifest() {

    const response =
        await fetch(
            MANIFEST_FILE +
            "?t=" +
            Date.now(),
            {
                method: "GET",
                cache: "no-store"
            }
        );


    if (!response.ok) {

        throw new Error(
            "Unable to load updates.json"
        );

    }


    const data =
        await response.json();


    if (!Array.isArray(data)) {

        throw new Error(
            "updates.json must contain an array"
        );

    }


    return data;

}


/* =========================================================
   LOAD AVAILABLE SONGS
========================================================= */

async function loadSongs() {

    updatesContainer.innerHTML = "";

    statusElement.textContent =
        "Checking available updates...";


    try {

        /*
            ONE REQUEST ONLY.

            No more:

            1.mp4
            2.mp4
            3.mp4
            ...
            99999.mp4
        */

        const manifest =
            await loadManifest();


        /*
            Clean and validate
            the manifest.
        */

        const songs =
            manifest
                .filter(isValidSongFile)
                .map(
                    fileName =>
                        fileName.toLowerCase()
                );


        /*
            Remove duplicates.
        */

        const uniqueSongs =
            [...new Set(songs)];


        /*
            Sort numerically.
        */

        uniqueSongs.sort(
            (a, b) => {

                const numberA =
                    parseInt(
                        a.replace(".mp4", ""),
                        10
                    );

                const numberB =
                    parseInt(
                        b.replace(".mp4", ""),
                        10
                    );

                return numberA - numberB;

            }
        );


        /* =================================================
           NO SONGS
        ================================================= */

        if (
            uniqueSongs.length === 0
        ) {

            statusElement.innerHTML =
                "No song packages are currently available.";


            updatesContainer.innerHTML =
                `
                <div class="empty">
                    No song updates available.
                </div>
                `;


            return;

        }


        /* =================================================
           CREATE SONG CARDS
        ================================================= */

        const fragment =
            document.createDocumentFragment();


        for (
            const fileName
            of uniqueSongs
        ) {

            const element =
                createSongElement(
                    fileName
                );


            fragment.appendChild(
                element
            );

        }


        updatesContainer.appendChild(
            fragment
        );


        /* =================================================
           STATUS
        ================================================= */

        statusElement.innerHTML =
            "<strong>" +
            uniqueSongs.length +
            "</strong> song" +
            (
                uniqueSongs.length === 1
                    ? ""
                    : "s"
            ) +
            " available.";


    }

    catch (error) {

        console.error(
            "Update manifest error:",
            error
        );


        statusElement.textContent =
            "Unable to check song updates.";


        updatesContainer.innerHTML =
            `
            <div class="error">
                Cannot load updates.json.
                <br><br>
                Please make sure the file exists
                in the songupdate folder.
            </div>
            `;

    }

}


/* =========================================================
   START
========================================================= */

loadSongs();

</script>

</body>

</html>
