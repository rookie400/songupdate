<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Echo Mix Videoke - Song Updates</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    font-family: Arial, Helvetica, sans-serif;
    background: #080808;
    color: #fff;
}

body {
    padding: 30px 18px 50px;
}

.container {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
}

.header {
    text-align: center;
    margin-bottom: 30px;
}

.header h1 {
    margin: 0;
    font-size: 36px;
    font-weight: 800;
    letter-spacing: 1px;
}

.header p {
    margin: 10px 0 0;
    color: #aaa;
    font-size: 16px;
}

.status {
    background: #151515;
    border: 1px solid #292929;
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 20px;
    text-align: center;
    color: #bbb;
}

.status strong {
    color: #fff;
}

.updates {
    display: grid;
    grid-template-columns: repeat(
        auto-fit,
        minmax(260px, 1fr)
    );
    gap: 12px;
}

.update {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: #151515;
    border: 1px solid #292929;
    border-radius: 12px;
    padding: 14px 16px;
}

.update-name {
    min-width: 0;
}

.update-name strong {
    display: block;
    font-size: 16px;
    word-break: break-all;
}

.update-name span {
    display: block;
    margin-top: 4px;
    font-size: 12px;
    color: #888;
}

.download {
    flex-shrink: 0;
    display: inline-block;
    padding: 9px 14px;
    border-radius: 8px;
    background: #19c463;
    color: #000;
    text-decoration: none;
    font-weight: 700;
    font-size: 13px;
}

.download:hover {
    filter: brightness(1.12);
}

.footer {
    margin-top: 30px;
    text-align: center;
    color: #666;
    font-size: 12px;
}

.loading {
    text-align: center;
    color: #aaa;
    padding: 30px;
}

.empty {
    text-align: center;
    color: #888;
    padding: 30px;
    background: #151515;
    border: 1px solid #292929;
    border-radius: 12px;
}

.error {
    text-align: center;
    color: #ff6b6b;
    padding: 30px;
    background: #151515;
    border: 1px solid #292929;
    border-radius: 12px;
}

@media (max-width: 600px) {

    body {
        padding: 20px 12px 40px;
    }

    .header h1 {
        font-size: 28px;
    }

    .update {
        padding: 12px;
    }

    .download {
        padding: 8px 11px;
    }

}

</style>

</head>

<body>

<div class="container">

    <div class="header">

        <h1>🎤 Echo Mix Videoke</h1>

        <p>
            Song Update Center
        </p>

    </div>


    <div class="status" id="status">

        Checking available updates...

    </div>


    <div class="updates" id="updates">

        <div class="loading">
            Please wait...
        </div>

    </div>


    <div class="footer">

        Echo Mix Videoke Song Update Server

    </div>

</div>


<script>

"use strict";


/* =========================================================
   GITHUB SETTINGS
========================================================= */

/*
    GitHub repository:

    https://github.com/rookie400/songupdate

    GitHub Pages:

    https://rookie400.github.io/songupdate/
*/

const GITHUB_OWNER =
    "rookie400";

const GITHUB_REPOSITORY =
    "songupdate";

const GITHUB_BRANCH =
    "main";


const BASE_URL =
    "https://rookie400.github.io/songupdate/";


/*
    GitHub API.

    This gets the actual files in the repository.

    No 1.mp4 -> 99999.mp4 scanning.
*/

const GITHUB_API =
    "https://api.github.com/repos/" +
    GITHUB_OWNER +
    "/" +
    GITHUB_REPOSITORY +
    "/git/trees/" +
    GITHUB_BRANCH +
    "?recursive=1";


/* =========================================================
   ELEMENTS
========================================================= */

const updatesContainer =
    document.getElementById("updates");

const statusElement =
    document.getElementById("status");


/* =========================================================
   VALID SONG FILE
========================================================= */

function isValidSongFile(path) {

    if (
        typeof path !== "string"
    ) {

        return false;

    }


    /*
        Only root-level:

        1.mp4
        25.mp4
        1234.mp4
        99999.mp4

        No folders.
    */

    return /^[1-9][0-9]{0,4}\.mp4$/i
        .test(path);

}


/* =========================================================
   CREATE SONG ELEMENT
========================================================= */

function createSongElement(fileName) {

    const item =
        document.createElement("div");

    item.className =
        "update";


    const name =
        document.createElement("div");

    name.className =
        "update-name";


    const title =
        document.createElement("strong");

    title.textContent =
        fileName;


    const description =
        document.createElement("span");

    description.textContent =
        "Song package available";


    name.appendChild(title);

    name.appendChild(description);


    const button =
        document.createElement("a");

    button.className =
        "download";

    button.textContent =
        "DOWNLOAD";


    button.href =
        BASE_URL +
        encodeURIComponent(fileName);


    button.download =
        fileName;


    item.appendChild(name);

    item.appendChild(button);


    return item;

}


/* =========================================================
   GET FILES FROM GITHUB
========================================================= */

async function getGitHubSongs() {

    const response =
        await fetch(
            GITHUB_API +
            "&t=" +
            Date.now(),
            {
                method: "GET",
                cache: "no-store",
                headers: {
                    "Accept":
                        "application/vnd.github+json"
                }
            }
        );


    if (!response.ok) {

        throw new Error(
            "GitHub API error: " +
            response.status
        );

    }


    const data =
        await response.json();


    /*
        GitHub can indicate that
        the recursive tree was truncated.
    */

    if (data.truncated) {

        console.warn(
            "GitHub repository tree was truncated."
        );

    }


    if (
        !Array.isArray(data.tree)
    ) {

        throw new Error(
            "Invalid GitHub API response."
        );

    }


    const songs =
        data.tree
            .filter(
                item =>
                    item.type === "blob"
            )
            .map(
                item =>
                    item.path
            )
            .filter(
                isValidSongFile
            )
            .map(
                fileName =>
                    fileName.toLowerCase()
            );


    /*
        Remove duplicates.
    */

    const uniqueSongs =
        [...new Set(songs)];


    /*
        Sort by song number.
    */

    uniqueSongs.sort(
        (a, b) => {

            const numberA =
                parseInt(
                    a.replace(".mp4", ""),
                    10
                );

            const numberB =
                parseInt(
                    b.replace(".mp4", ""),
                    10
                );

            return numberA - numberB;

        }
    );


    return uniqueSongs;

}


/* =========================================================
   LOAD AVAILABLE SONGS
========================================================= */

async function loadSongs() {

    updatesContainer.innerHTML =
        `
        <div class="loading">
            Scanning GitHub...
        </div>
        `;


    statusElement.textContent =
        "Checking available updates...";


    try {

        /*
            ONE GITHUB API REQUEST.

            It does NOT check:

            1.mp4
            2.mp4
            3.mp4
            ...
            99999.mp4
        */

        const songs =
            await getGitHubSongs();


        /* =================================================
           NO SONGS
        ================================================= */

        if (
            songs.length === 0
        ) {

            statusElement.innerHTML =
                "No song packages are currently available.";


            updatesContainer.innerHTML =
                `
                <div class="empty">
                    No song updates available.
                </div>
                `;


            return;

        }


        /* =================================================
           CREATE ALL CARDS
        ================================================= */

        const fragment =
            document.createDocumentFragment();


        for (
            const fileName
            of songs
        ) {

            fragment.appendChild(
                createSongElement(
                    fileName
                )
            );

        }


        updatesContainer.innerHTML = "";

        updatesContainer.appendChild(
            fragment
        );


        /* =================================================
           STATUS
        ================================================= */

        statusElement.innerHTML =
            "<strong>" +
            songs.length +
            "</strong> song" +
            (
                songs.length === 1
                    ? ""
                    : "s"
            ) +
            " available.";


    }

    catch (error) {

        console.error(
            "GitHub update scan error:",
            error
        );


        statusElement.innerHTML =
            "Unable to check song updates.";


        updatesContainer.innerHTML =
            `
            <div class="error">
                Cannot read the GitHub song list.
                <br><br>
                Please check the repository
                and branch settings.
            </div>
            `;

    }

}


/* =========================================================
   START
========================================================= */

loadSongs();

</script>

</body>

</html>
