<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Song Update Center</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    width:100%;
    min-height:100%;
    background:#050505;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    padding:20px;
}

.container{
    width:100%;
    max-width:900px;
    margin:0 auto;
}

.title{
    text-align:center;
    font-size:30px;
    font-weight:bold;
    margin:10px 0 6px;
}

.subtitle{
    text-align:center;
    color:#aaa;
    font-size:14px;
    margin-bottom:25px;
}

.status{
    background:#111;
    border:1px solid #292929;
    border-radius:14px;
    padding:18px;
    margin-bottom:20px;
}

.status-title{
    font-size:13px;
    color:#888;
    margin-bottom:7px;
}

.status-text{
    font-size:18px;
    font-weight:bold;
}

.progress-wrap{
    display:none;
    margin-top:15px;
}

.progress-bar-bg{
    width:100%;
    height:18px;
    background:#222;
    border-radius:20px;
    overflow:hidden;
}

.progress-bar{
    width:0%;
    height:100%;
    background:#00e676;
    transition:width .15s linear;
}

.progress-text{
    text-align:center;
    margin-top:8px;
    font-size:14px;
    color:#bbb;
}

.buttons{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

button{
    flex:1;
    border:0;
    border-radius:12px;
    padding:15px;
    font-size:16px;
    font-weight:bold;
    color:white;
    background:#1769e0;
    cursor:pointer;
}

button:active{
    transform:scale(.98);
}

button:disabled{
    opacity:.45;
    cursor:not-allowed;
}

.scan-btn{
    background:#1769e0;
}

.refresh-btn{
    background:#333;
}

.list{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    background:#111;
    border:1px solid #242424;
    border-radius:12px;
    padding:13px 15px;
}

.item-name{
    font-size:16px;
    font-weight:bold;
}

.item-status{
    font-size:13px;
    color:#999;
}

.available{
    color:#00e676;
}

.empty{
    text-align:center;
    padding:35px 10px;
    color:#777;
}

.count{
    margin-bottom:12px;
    color:#aaa;
    font-size:14px;
}

.loading{
    display:none;
    text-align:center;
    padding:20px;
    color:#aaa;
}

.spinner{
    width:28px;
    height:28px;
    border:3px solid #333;
    border-top-color:#00e676;
    border-radius:50%;
    animation:spin .8s linear infinite;
    margin:0 auto 10px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

@media(max-width:600px){

    body{
        padding:12px;
    }

    .title{
        font-size:24px;
    }

    .buttons{
        flex-direction:column;
    }

}

</style>

</head>

<body>

<div class="container">

    <div class="title">
        SONG UPDATE CENTER
    </div>

    <div class="subtitle">
        Available update packages
    </div>

    <div class="status">

        <div class="status-title">
            STATUS
        </div>

        <div id="statusText"
             class="status-text">
            Ready
        </div>

        <div id="progressWrap"
             class="progress-wrap">

            <div class="progress-bar-bg">

                <div id="progressBar"
                     class="progress-bar">
                </div>

            </div>

            <div id="progressText"
                 class="progress-text">
                0%
            </div>

        </div>

    </div>

    <div class="buttons">

        <button id="scanBtn"
                class="scan-btn"
                onclick="loadSongs()">
            SCAN UPDATES
        </button>

        <button id="refreshBtn"
                class="refresh-btn"
                onclick="location.reload()">
            REFRESH
        </button>

    </div>

    <div id="count"
         class="count">
        No scan performed yet.
    </div>

    <div id="loading"
         class="loading">

        <div class="spinner"></div>

        Scanning update packages...

    </div>

    <div id="songList"
         class="list">

        <div class="empty">
            Press SCAN UPDATES
        </div>

    </div>

</div>

<script>

const BASE_URL = "./";

const MAX_UPDATE_PACKAGE = 100;


/* =========================================================
   ELEMENTS
========================================================= */

const scanBtn =
    document.getElementById("scanBtn");

const refreshBtn =
    document.getElementById("refreshBtn");

const statusText =
    document.getElementById("statusText");

const songList =
    document.getElementById("songList");

const countText =
    document.getElementById("count");

const loading =
    document.getElementById("loading");

const progressWrap =
    document.getElementById("progressWrap");

const progressBar =
    document.getElementById("progressBar");

const progressText =
    document.getElementById("progressText");


/* =========================================================
   CHECK FILE
========================================================= */

async function fileExists(fileName){

    try{

        const response =
            await fetch(
                BASE_URL + fileName,
                {
                    method:"HEAD",
                    cache:"no-store"
                }
            );

        return response.ok;

    }catch(error){

        return false;

    }

}


/* =========================================================
   LOAD SONGS
========================================================= */

async function loadSongs(){

    scanBtn.disabled = true;

    refreshBtn.disabled = true;

    loading.style.display = "block";

    progressWrap.style.display = "block";

    progressBar.style.width = "0%";

    progressText.textContent =
        "Scanning 0 / " +
        MAX_UPDATE_PACKAGE;

    statusText.textContent =
        "Scanning updates...";

    songList.innerHTML = "";

    countText.textContent =
        "Scanning...";


    const available = [];


    /*
       Scan only:

       1update.data
       2update.data
       ...
       100update.data
    */

    for(
        let i = 1;
        i <= MAX_UPDATE_PACKAGE;
        i++
    ){

        const fileName =
            i + "update.data";

        const exists =
            await fileExists(fileName);


        if(exists){

            available.push({
                number:i,
                name:fileName
            });

        }


        const percent =
            Math.round(
                (i / MAX_UPDATE_PACKAGE) * 100
            );


        progressBar.style.width =
            percent + "%";

        progressText.textContent =
            "Scanning " +
            i +
            " / " +
            MAX_UPDATE_PACKAGE +
            " (" +
            percent +
            "%)";

    }


    loading.style.display = "none";


    if(available.length === 0){

        statusText.textContent =
            "NO UPDATE YET";

        countText.textContent =
            "No update packages available.";

        songList.innerHTML =
            '<div class="empty">' +
            'NO UPDATE YET' +
            '</div>';

    }else{

        statusText.textContent =
            available.length +
            " UPDATE PACKAGE" +
            (available.length === 1 ? "" : "S") +
            " AVAILABLE";


        countText.textContent =
            available.length +
            " package" +
            (available.length === 1 ? "" : "s") +
            " found.";


        renderSongs(available);

    }


    progressBar.style.width = "100%";

    progressText.textContent =
        "SCAN COMPLETED";


    scanBtn.disabled = false;

    refreshBtn.disabled = false;

}


/* =========================================================
   DISPLAY AVAILABLE FILES
========================================================= */

function renderSongs(files){

    songList.innerHTML = "";


    files.forEach(file => {

        const item =
            document.createElement("div");

        item.className =
            "item";


        const name =
            document.createElement("div");

        name.className =
            "item-name";

        name.textContent =
            file.name;


        const state =
            document.createElement("div");

        state.className =
            "item-status available";

        state.textContent =
            "AVAILABLE";


        item.appendChild(name);

        item.appendChild(state);

        songList.appendChild(item);

    });

}


/* =========================================================
   OPTIONAL AUTO SCAN
========================================================= */

window.addEventListener(
    "load",
    () => {

        loadSongs();

    }
);

</script>

</body>
</html>
